<style>
  /* ==========================================================================
     ☀️ LIGHT MODE (Default)
     ========================================================================== */

  /* Force the document background inside the preview frame to be slate-50 */

    background-color: #f8fafc !important;
    color: #0f172a !important;
    transition:
      background-color 0.2s ease,
      color 0.2s ease;
  }

  /* Target the built-in Storybook Docs container background */
  .docs-story,
  .sbdocs,
  .sbdocs-wrapper,

  }

     ========================================================================== */

  /* Activates when .dark class or data-theme="dark" is on the <html> tag */

  html[data-theme="dark"],
  html[data-theme="dark"] body {
    background-color: #0f172a !important;

  html.dark .sbdocs,

  html[data-theme="dark"] .sbdocs-content {
